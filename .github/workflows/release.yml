name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Tag builds cannot *create* caches that later tags reliably reuse (GHA caches
# are branch-scoped; only the default branch is a shared source). The
# cache-warm workflow on main populates the same rust-cache / bun keys so
# release jobs restore a warm target/. See docs/AGENT_WORKFLOW.md.
#
# Timing (v0.1.8 warm Windows runner, ~13 min sequential):
#   setup/caches ~2 min | cargo test debug ~2.5 min | tauri build ~8 min
# validate + build run in parallel so wall clock ≈ max(test, build) + publish.

env:
  CARGO_TERM_COLOR: always
  # With restored dep artifacts, non-incremental builds avoid writing huge
  # incremental graphs that bloat the Windows cache for little gain.
  CARGO_INCREMENTAL: "0"

jobs:
  # ── quality gate (debug cargo + JS) — overlaps with release build ──────────
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-rust-cache-toolchain

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Debug profile cache key is separate from release (wui-release).
      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace, Cargo.lock, and target/ all live at the repo root.
          workspaces: . -> target
          prefix-key: v2-rust
          shared-key: wui-debug-lib
          cache-all-crates: true
          cache-on-failure: true

      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-versions.ts
      - run: bun run assets:build
      - run: bun run assets:check
      - run: bun run typecheck
      - run: bun run test:all

      # Debug-profile unit tests only — never release-profile, so we do not
      # recompile what the parallel build job already compiles as release.
      - name: Cargo lib tests (debug)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # ── Windows NSIS bundle ───────────────────────────────────────────────────
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-rust-cache-toolchain

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Restore release-profile deps warmed on main (see cache-warm.yml).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          prefix-key: v2-rust
          shared-key: wui-release
          cache-all-crates: true
          cache-on-failure: true

      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-versions.ts

      - name: Build Tauri app
        run: bun run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wonderful-ui-${{ github.ref_name }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 14

  # ── GitHub Release (only after both jobs succeed) ────────────
  publish:
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow is enough when versions.json has notes; still fetch tags
          # for the git-log fallback when notes are empty.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wonderful-ui-${{ github.ref_name }}
          path: target/release/bundle

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
