[package]
name = "wonderful-ui"
version = "1.1.0-beta.1"
authors = ["WizisCool", "murainy", "WonderfulUI Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/nightx521/wonderfulUI"
homepage = "https://github.com/nightx521/wonderfulUI"
description = "Personal Valorant highlight library for Windows"
edition = "2021"
rust-version = "1.88"

[features]
default = ["updater", "process"]
updater = ["tauri-plugin-updater"]
process = ["tauri-plugin-process"]

[lib]
name = "wonderful_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rayon = "1"
# 跨设备"快传"分享：内嵌 HTTP server + 二维码生成。
# - qrcode: 成熟 QR 库，生成 SVG 字符串给前端直接渲染
# - rand: token 生成（256 位熵 base64url）
qrcode = "0.14"
rand = "0.8"
base64 = "0.22"
rusty-leveldb = "4"
tauri-plugin-updater = { version = "=2.10.1", optional = true }
tauri-plugin-process = { version = "=2.3.1", optional = true }

tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Re-encode MediaComposition thumbnails (often JPEG) to PNG for clipboard/save.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Cross-platform operational interface enumeration for LAN share when the host
# has no default IPv4 route. The primary route-selection probe still uses std.
if-addrs = "0.15"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[target.'cfg(windows)'.dependencies]
# 与 tauri 2.0.1 锁定的 windows 0.61 同主版本，直接用 ShellExecuteW 走原生
# "以默认程序打开" 通道，绕过 cmd /c 解析开销。
# Media_Editing / Storage: backend video frame capture (GetThumbnailAsync).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Frame capture: IMFSourceReader seek + RGB32 decode
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
] }
